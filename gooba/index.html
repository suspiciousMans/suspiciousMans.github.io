<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gooba — Retro Dithering Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23151520'/%3E%3Crect x='2' y='2' width='4' height='4' fill='%23c6ff3d'/%3E%3Crect x='10' y='2' width='4' height='4' fill='%23ff6bd6'/%3E%3Crect x='6' y='6' width='4' height='4' fill='%239bbc0f'/%3E%3Crect x='2' y='10' width='4' height='4' fill='%237b5cff'/%3E%3Crect x='10' y='10' width='4' height='4' fill='%2355ffff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <span class="logo-mark">◆</span>
      <h1>GOOBA</h1>
    </div>
    <p class="tagline">turn your photos into crunchy retro pixels</p>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <div class="canvas-wrap" id="dropZone">
        <canvas id="previewCanvas"></canvas>
        <div class="empty-state" id="emptyState">
          <p><strong>Drop an image here</strong></p>
          <p>or</p>
          <button id="chooseFileBtn" class="btn btn-primary" type="button">Choose a file</button>
          <button id="sampleBtn" class="btn btn-ghost" type="button">Use a sample image</button>
          <input type="file" id="fileInput" accept="image/*" hidden />
        </div>
      </div>
      <div class="stage-actions" id="stageActions" hidden>
        <button id="changeImageBtn" class="btn btn-ghost" type="button">Change image</button>
        <button id="downloadBtn" class="btn btn-primary" type="button">Download PNG</button>
      </div>
    </section>

    <aside class="controls" id="controls">
      <div class="control-group">
        <h2>Algorithm</h2>
        <label class="field">
          <span>Dither method</span>
          <select id="algorithm">
            <option value="floydSteinberg" selected>Floyd–Steinberg</option>
            <option value="atkinson">Atkinson</option>
            <option value="jarvisJudiceNinke">Jarvis-Judice-Ninke</option>
            <option value="stucki">Stucki</option>
            <option value="burkes">Burkes</option>
            <option value="sierraLite">Sierra Lite</option>
            <option value="ordered">Ordered (Bayer)</option>
            <option value="random">Random Noise</option>
            <option value="none">None (posterize only)</option>
          </select>
        </label>
        <label class="field" id="bayerField" hidden>
          <span>Bayer matrix</span>
          <select id="bayerSize">
            <option value="2">2×2</option>
            <option value="4" selected>4×4</option>
            <option value="8">8×8</option>
          </select>
        </label>
        <label class="field">
          <span>Strength <output id="amountOut">1.0</output></span>
          <input type="range" id="amount" min="0" max="2" step="0.05" value="1" />
        </label>
      </div>

      <div class="control-group">
        <h2>Color</h2>
        <label class="field">
          <span>Mode</span>
          <select id="colorMode">
            <option value="levels" selected>Full Color (RGB levels)</option>
            <option value="grayscale">Grayscale</option>
            <option value="palette">Preset Palette</option>
            <option value="duotone">Custom Duotone</option>
            <option value="auto">Auto-Extract Palette</option>
          </select>
        </label>
        <label class="field" id="levelsField">
          <span>Levels per channel <output id="levelsOut">4</output></span>
          <input type="range" id="levels" min="2" max="8" step="1" value="4" />
        </label>
        <label class="field" id="paletteField" hidden>
          <span>Preset</span>
          <select id="presetPalette"></select>
        </label>
        <div class="field duotone-row" id="duotoneField" hidden>
          <label class="swatch-label">
            <span>Dark</span>
            <input type="color" id="duotoneDark" value="#0f380f" />
          </label>
          <label class="swatch-label">
            <span>Light</span>
            <input type="color" id="duotoneLight" value="#9bbc0f" />
          </label>
        </div>
        <label class="field" id="autoField" hidden>
          <span>Colors <output id="autoOut">6</output></span>
          <input type="range" id="autoColors" min="2" max="16" step="1" value="6" />
        </label>
        <label class="field checkbox-field">
          <span>Invert</span>
          <input type="checkbox" id="invert" />
        </label>
      </div>

      <div class="control-group">
        <h2>Image</h2>
        <label class="field">
          <span>Pixel size <output id="pixelSizeOut">4</output>px</span>
          <input type="range" id="pixelSize" min="1" max="16" step="1" value="4" />
        </label>
        <label class="field">
          <span>Brightness <output id="brightnessOut">0</output></span>
          <input type="range" id="brightness" min="-100" max="100" step="1" value="0" />
        </label>
        <label class="field">
          <span>Contrast <output id="contrastOut">0</output></span>
          <input type="range" id="contrast" min="-100" max="100" step="1" value="0" />
        </label>
      </div>

      <button id="resetBtn" class="btn btn-ghost full-width" type="button">Reset settings</button>
    </aside>
  </main>

  <footer class="site-footer">
    <p>Gooba runs entirely in your browser — nothing you upload leaves your machine.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>

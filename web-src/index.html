    <meta name="theme-color" content="#0a0833" />
    <script>
      // Apply the saved color theme before first paint (see src/theme.js).
      (function () {
        var t = "saffron";
        try { t = localStorage.getItem("theme") || t; } catch (e) {}
        if (t !== "saffron" && t !== "ember") t = "saffron";
        document.documentElement.dataset.theme = t;
        if (t === "ember") document.querySelector('meta[name="theme-color"]').content = "#140a06";
      })();
    </script>

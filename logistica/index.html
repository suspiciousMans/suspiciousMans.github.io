<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Logistica</title>
    <meta name="description" content="Logistica: a gate-level logic simulator and microprocessor-building sandbox, running entirely in the browser via WebAssembly." />

    <!-- A small inline SVG "AND gate" glyph as the favicon — no extra asset file needed. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b1b1b'/%3E%3Cpath d='M8 7h7a9 9 0 0 1 0 18H8Z' fill='none' stroke='%235bc0ea' stroke-width='2.5'/%3E%3Cline x1='4' y1='11' x2='8' y2='11' stroke='%235bc0ea' stroke-width='2.5'/%3E%3Cline x1='4' y1='21' x2='8' y2='21' stroke='%235bc0ea' stroke-width='2.5'/%3E%3Cline x1='24' y1='16' x2='29' y2='16' stroke='%235bc0ea' stroke-width='2.5'/%3E%3C/svg%3E" />

    <!-- Trunk picks up the crate's Cargo.toml from this directory, compiles it for
         wasm32-unknown-unknown, runs wasm-bindgen, and copies everything into dist/. -->
    
<script type="module">
import init, * as bindings from './logistica-app-f32bfd211064ad4.js';
const wasm = await init({ module_or_path: './logistica-app-f32bfd211064ad4_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: #1b1b1b;
        }
        /* Matches egui's default dark visuals so there's no flash of the wrong
           color while the wasm binary downloads and compiles. */
        #logistica_canvas {
            display: block;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        #logistica_loading_text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #cfd6dc;
            letter-spacing: 0.02em;
        }
    </style>
<link rel="modulepreload" href="./logistica-app-f32bfd211064ad4.js" crossorigin="anonymous" integrity="sha384-9ZuCmghMjRXJpz4av7sIQfgElJGsFZM08iVgVc2w5A2N4JpnCUHgzOafMAUbfawt"><link rel="preload" href="./logistica-app-f32bfd211064ad4_bg.wasm" crossorigin="anonymous" integrity="sha384-aOK3IjoIzcj7+0VZnyah6YpL89bZZII5OB34xQQ+Who4uaimsvfNAxWuwx/pqpAp" as="fetch" type="application/wasm"></head>
<body>
    <canvas id="logistica_canvas"></canvas>
    <div id="logistica_loading_text">Loading Logistica…</div>

    <noscript>Logistica needs JavaScript and WebAssembly enabled to run.</noscript>
</body>
</html>

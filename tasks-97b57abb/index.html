<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Task Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,3 93,26 93,74 50,97 7,74 7,26' fill='%23060f11' stroke='%2301c887' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #060f11;
    --ink-2: #3c444c;
    --surface: #0c171a;
    --surface-2: #101d21;
    --border: rgba(1, 200, 135, 0.18);
    --accent: #01c887;
    --accent-soft: rgba(1, 200, 135, 0.12);
    --danger: #ef6461;
    --text: #e9f3f1;
    --text-dim: #9fb3af;
    --radius: 14px;
    --font: "Roboto", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--text);
    background: var(--ink);
    background: linear-gradient(160deg, var(--ink) 0%, var(--ink) 55%, var(--ink-2) 140%);
    min-height: 100vh;
  }
  .gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .gate-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    text-align: center;
  }
  .gate-mark { width: 40px; height: 40px; margin: 0 auto 14px; display: block; }
  .gate-card h1 {
    font-size: 16px;
    margin: 0 0 18px;
    color: var(--text-dim);
    font-weight: 500;
    letter-spacing: 0.3px;
  }
  .gate-card input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 12px;
  }
  .gate-card input[type="password"]:focus { outline: none; border-color: var(--accent); }
  .gate-card button {
    width: 100%;
    padding: 10px 12px;
    background: var(--accent);
    color: #06120c;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
  }
  .gate-card button:hover { filter: brightness(1.08); }
  .gate-error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 12px;
    min-height: 16px;
  }
  #app-mount { display: none; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <svg class="gate-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="50,3 93,26 93,74 50,97 7,74 7,26" fill="#060f11" stroke="#01c887" stroke-width="6" />
    </svg>
    <h1>Enter password</h1>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="gate-password" placeholder="Password" autofocus>
      <button type="submit">Unlock</button>
      <div class="gate-error" id="gate-error"></div>
    </form>
  </div>
</div>

<div id="app-mount"></div>

<template id="app-template">
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 100 100" class="brand-mark" aria-hidden="true">
          <rect x="10" y="10" width="80" height="80" rx="16" fill="#0c171a" stroke="#01c887" stroke-width="6"/>
          <path d="M28 52l16 16 28-32" fill="none" stroke="#01c887" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Task Manager</span>
      </div>
      <div class="stats" id="stats"></div>
      <div class="view-switch" role="tablist" aria-label="View">
        <button type="button" class="view-btn active" data-view="list" role="tab" aria-selected="true">List</button>
        <button type="button" class="view-btn" data-view="calendar" role="tab" aria-selected="false">Calendar</button>
      </div>
    </header>

    <div class="body">
      <aside class="sidebar">
        <form id="task-form" class="task-form">
          <h2 id="form-heading">Add task</h2>
          <input type="hidden" id="task-id">
          <label>
            Title
            <input type="text" id="f-title" required placeholder="What needs doing?" autocomplete="off">
          </label>
          <label>
            Notes
            <textarea id="f-notes" rows="2" placeholder="Optional details"></textarea>
          </label>
          <label>
            Due date
            <input type="date" id="f-date">
          </label>
          <div class="quick-dates">
            <button type="button" class="btn-chip" data-quick-date="today">Today</button>
            <button type="button" class="btn-chip" data-quick-date="tomorrow">Tomorrow</button>
            <button type="button" class="btn-chip" data-quick-date="week">+1 week</button>
            <button type="button" class="btn-chip" data-quick-date="clear">Clear</button>
          </div>
          <div class="row">
            <label>
              Time
              <input type="time" id="f-time">
            </label>
            <label>
              Priority
              <select id="f-priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </label>
          </div>
          <label>
            Tags
            <div class="tag-input-wrap">
              <div class="tag-chips" id="tag-chips"></div>
              <input type="text" id="f-tag-input" list="tag-list" placeholder="Add a tag, press Enter" autocomplete="off">
              <datalist id="tag-list"></datalist>
            </div>
          </label>
          <label>
            Repeat
            <select id="f-repeat">
              <option value="none" selected>Does not repeat</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
              <option value="yearly">Yearly</option>
            </select>
          </label>
          <label id="repeat-interval-row" hidden>
            Every
            <div class="repeat-interval-wrap">
              <input type="number" id="f-repeat-interval" min="1" max="99" value="1" inputmode="numeric">
              <span id="f-repeat-interval-unit">day(s)</span>
            </div>
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="form-submit">Add task</button>
            <button type="button" class="btn btn-ghost" id="form-cancel" hidden>Cancel edit</button>
          </div>
        </form>

        <div class="filters">
          <h2>Filters</h2>
          <label>
            Search <span class="hint">(press /)</span>
            <input type="search" id="f-search" placeholder="Search tasks">
          </label>
          <label>
            Status
            <select id="f-status">
              <option value="active">Active</option>
              <option value="all">All</option>
              <option value="completed">Completed</option>
            </select>
          </label>
          <label>
            Tag
            <select id="f-tag-filter">
              <option value="">All tags</option>
            </select>
          </label>
        </div>

        <div class="tag-manager-section">
          <h2>Manage tags</h2>
          <div id="tag-manager" class="tag-manager"></div>
        </div>

        <div class="backup">
          <h2>Backup</h2>
          <div class="backup-actions">
            <button type="button" class="btn" id="export-btn">Export JSON</button>
            <button type="button" class="btn" id="import-btn">Import JSON</button>
            <input type="file" id="import-file" accept="application/json" hidden>
          </div>
        </div>

        <div class="sync">
          <h2>Sync across devices</h2>
          <div id="sync-disconnected">
            <label>
              Sync code
              <input type="text" id="sync-code-input" placeholder="Enter or generate a code" autocomplete="off" maxlength="12">
            </label>
            <div class="sync-actions">
              <button type="button" class="btn" id="sync-generate-btn">Generate</button>
              <button type="button" class="btn btn-primary" id="sync-connect-btn">Connect</button>
            </div>
          </div>
          <div id="sync-connected" hidden>
            <div class="sync-code-display">
              Code: <code id="sync-code-shown"></code>
              <button type="button" class="btn-icon" id="sync-copy-btn" title="Copy code">&#128203;</button>
            </div>
            <button type="button" class="btn btn-ghost" id="sync-disconnect-btn">Disconnect</button>
          </div>
          <p class="sync-status" id="sync-status"></p>
        </div>
      </aside>

      <main class="content">
        <section id="list-view" class="view-panel"></section>
        <section id="calendar-view" class="view-panel" hidden></section>
      </main>
    </div>
  </div>
</template>

<script>
(() => {
  "use strict";

  // SHA-256 hex digest of the access password. The password itself is
  // never stored client-side, only this digest, so reading this file
  // does not hand over the password directly.
  const PASSWORD_HASH = "cda50639dc40233417160cbad4f46a7d0f76e8cccc0c38dfd30e3cb7aaaf25ae";
  const SESSION_KEY = "tm_gate_ok";

  async function sha256Hex(text) {
    const data = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, "0")).join("");
  }

  function unlock() {
    document.getElementById("gate").style.display = "none";
    const mount = document.getElementById("app-mount");
    const template = document.getElementById("app-template");
    mount.appendChild(template.content.cloneNode(true));
    mount.style.display = "block";

    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "app.css";
    document.head.appendChild(link);

    const script = document.createElement("script");
    script.src = "app.js";
    document.body.appendChild(script);
  }

  const form = document.getElementById("gate-form");
  const passwordInput = document.getElementById("gate-password");
  const errorEl = document.getElementById("gate-error");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const hash = await sha256Hex(passwordInput.value);
    if (hash === PASSWORD_HASH) {
      sessionStorage.setItem(SESSION_KEY, "1");
      unlock();
    } else {
      errorEl.textContent = "Incorrect password.";
      passwordInput.value = "";
      passwordInput.focus();
    }
  });

  if (sessionStorage.getItem(SESSION_KEY) === "1") {
    unlock();
  }
})();
</script>
</body>
</html>
